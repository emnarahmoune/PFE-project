# ===== APPLICATION =====
spring.application.name=ecom

# ===== MYSQL =====
spring.datasource.url=jdbc:mysql://localhost:3306/ecom?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&sessionVariables=transaction_isolation='READ-COMMITTED'
spring.datasource.username=root
spring.datasource.password=ZAYNEBKH1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
# ===== SERVER =====
server.port=8082
server.error.include-message=always
server.error.include-binding-errors=always

# ===== LOGGING =====
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.web=INFO
logging.level.org.springframework.boot.web.embedded.tomcat=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG
logging.level.org.keycloak=DEBUG
logging.level.org.camunda.bpm.engine=INFO
logging.level.org.camunda.bpm.springboot=DEBUG
logging.level.com.codeWithProject.ecom=DEBUG

# ===== SWAGGER - Configuration pour SpringDoc 2.8.5 =====
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.swagger-ui.filter=true
springdoc.show-actuator=true

# ===== DEVTOOLS =====
spring.devtools.restart.enabled=false

# ===== KEYCLOAK =====
keycloak.auth-server-url=http://localhost:8180
keycloak.realm=portail_rh
keycloak.resource=portail_rh_backend
keycloak.credentials.secret=iCUODsDl97yd4VukhmmniZGUuyN3a4qu
keycloak.use-resource-role-mappings=true
keycloak.bearer-only=true
keycloak.principal-attribute=preferred_username
keycloak.cors=true
keycloak.ssl-required=external
keycloak.confidential-port=0

# ===== OAUTH2 RESOURCE SERVER =====
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/portail_rh
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/portail_rh/protocol/openid-connect/certs

# ===== ACTUATOR =====
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ===== CORS =====
spring.web.cors.allowed-origins=http://localhost:4200
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# ============================================
# CAMUNDA CONFIGURATION
# ============================================
camunda.bpm.database.type=mysql
camunda.bpm.database.schema-update=true
camunda.bpm.database.skip-isolation-level-check=true
camunda.bpm.process-engine-name=default
camunda.bpm.history-level=full
camunda.bpm.auto-deployment-enabled=false
camunda.bpm.deployment-resource-pattern=classpath*:/bpmn/**/*.bpmn,classpath*:/bpmn/**/*.bpmn20.xml
camunda.bpm.spin.dataformat.json=jackson
camunda.bpm.spin.dataformat.xml=dom
camunda.bpm.generate-unique-process-engine-name=false
camunda.bpm.webapp.index-redirect-enabled=true
camunda.bpm.webapp.security.enabled=false
camunda.rest.url=http://localhost:8082/engine-rest

# ============================================
# SECURITY METHOD (activer @PreAuthorize)
# ============================================
spring.security.method-security.enabled=true
camunda.bpm.identity-provider.keycloak.group-mapping.enabled=true
camunda.bpm.identity-provider.keycloak.group-mapping.role-prefix=
# URL du serveur Keycloak (sans /auth sur les versions r\u00E9centes)
keyclokeycloak.admin.server-url=http://localhost:8180
keycloak.admin.realm=portail_rh
keycloak.admin.client-id=admin-backend-client
