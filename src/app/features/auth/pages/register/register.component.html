<div class="register-container">
  <h2>Inscription</h2>
  <p class="subtitle">Créez votre compte RH</p>

  <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
    <div class="form-row">
      <mat-form-field appearance="outline" class="form-field">
        <mat-label>Nom</mat-label>
        <input matInput formControlName="nom" placeholder="Dupont">
        <mat-error *ngIf="registerForm.get('nom')?.hasError('required')">
          Nom requis
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="form-field">
        <mat-label>Prénom</mat-label>
        <input matInput formControlName="prenom" placeholder="Jean">
        <mat-error *ngIf="registerForm.get('prenom')?.hasError('required')">
          Prénom requis
        </mat-error>
      </mat-form-field>
    </div>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Email</mat-label>
      <input matInput type="email" formControlName="email" placeholder="jean.dupont@email.com">
      <mat-icon matSuffix>email</mat-icon>
      <mat-error *ngIf="registerForm.get('email')?.hasError('required')">
        Email requis
      </mat-error>
      <mat-error *ngIf="registerForm.get('email')?.hasError('email')">
        Email invalide
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Téléphone</mat-label>
      <input matInput formControlName="telephone" placeholder="+33 6 12 34 56 78">
      <mat-icon matSuffix>phone</mat-icon>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Mot de passe</mat-label>
      <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password">
      <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword">
        <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
      </button>
      <mat-error *ngIf="registerForm.get('password')?.hasError('required')">
        Mot de passe requis
      </mat-error>
      <mat-error *ngIf="registerForm.get('password')?.hasError('minlength')">
        Minimum 6 caractères
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Confirmer le mot de passe</mat-label>
      <input matInput [type]="hideConfirmPassword ? 'password' : 'text'" formControlName="confirmPassword">
      <button mat-icon-button matSuffix type="button" (click)="hideConfirmPassword = !hideConfirmPassword">
        <mat-icon>{{hideConfirmPassword ? 'visibility_off' : 'visibility'}}</mat-icon>
      </button>
      <mat-error *ngIf="registerForm.hasError('passwordMismatch')">
        Les mots de passe ne correspondent pas
      </mat-error>
    </mat-form-field>

    <button mat-raised-button color="primary" type="submit" 
            [disabled]="registerForm.invalid || loading" class="submit-button">
      <span *ngIf="!loading">S'inscrire</span>
      <mat-spinner diameter="20" *ngIf="loading"></mat-spinner>
    </button>

    <div class="login-link">
      Déjà un compte ? <a routerLink="/auth/login">Se connecter</a>
    </div>
  </form>
</div>
