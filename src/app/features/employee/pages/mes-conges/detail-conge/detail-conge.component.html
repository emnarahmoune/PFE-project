<div class="container" *ngIf="!loading && demande; else loadingTpl">

  <div class="card">
    <div class="card-header">
      <h2>Détail de la demande de congé</h2>
      <span class="badge" [ngClass]="getStatutClass()">
        {{ getStatutLabel() }}
      </span>
    </div>

    <div class="card-body">
      
      <div class="row">
        <div class="col">
          <label>Type</label>
          <p>{{ getTypeLabel() }}</p>
        </div>

        <div class="col">
          <label>Date début</label>
          <p>{{ getFormattedDate(demande.dateDebut) }}</p>
        </div>

        <div class="col">
          <label>Date fin</label>
          <p>{{ getFormattedDate(demande.dateFin) }}</p>
        </div>
      </div>

      <div class="row">
        <div class="col">
          <label>Durée</label>
          <p>{{ getDuree() }}</p>
        </div>

        <div class="col">
          <label>Date de demande</label>
          <p>{{ getFormattedDate(demande.dateDemande) }}</p>
        </div>
      </div>

      <!-- ✅ CORRECTION: Utiliser getMotif() au lieu de demande.motif -->
      <div class="row full">
        <label>Motif / Commentaire</label>
        <p class="motif">{{ getMotif() }}</p>
      </div>

      <!-- ✅ AFFICHER LE MOTIF DE REFUS SI PRÉSENT -->
      <div class="row full" *ngIf="demande.motifRefus">
        <label>Motif du refus</label>
        <p class="motif-refus">{{ demande.motifRefus }}</p>
      </div>

    </div>

    <div class="card-footer">
      <button class="btn back" (click)="goBack()">⬅ Retour</button>

      <button 
        *ngIf="canAnnuler" 
        class="btn cancel" 
        (click)="annulerDemande()">
        ❌ Annuler la demande
      </button>
    </div>
  </div>

</div>

<ng-template #loadingTpl>
  <div class="loading">
    <p>Chargement...</p>
  </div>
</ng-template>

<div *ngIf="error" class="error">
  {{ error }}
</div>
