<div class="layout" [class.dark-theme]="darkMode">

  <!-- SIDEBAR -->
  <aside class="sidebar" [class.collapsed]="!isSidebarOpen">

    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-icon">◈</div>
        <div class="logo-text" *ngIf="isSidebarOpen">PeopleOS</div>
      </div>

      <button (click)="toggleSidebar()">
        {{ isSidebarOpen ? '◀' : '▶' }}
      </button>
    </div>

    <!-- MENU -->
    <nav class="sidebar-nav">
      <a *ngFor="let item of menuItems"
         [routerLink]="item.path"
         routerLinkActive="active"
         class="nav-item"
         [class.active]="isRouteActive(item.path)">

        <span class="nav-icon">{{ item.icon }}</span>
        <span *ngIf="isSidebarOpen">{{ item.label }}</span>
      </a>
    </nav>

    <!-- FOOTER -->
    <div class="sidebar-footer" *ngIf="isSidebarOpen">

      <div class="user-info">
        <div class="user-avatar">
          {{ getUserInitials() }}
        </div>

        <div>
          <div>{{ getUserName() }}</div>
          <div>{{ userRole }}</div>
        </div>
      </div>

      <button (click)="logout()">🚪 Déconnexion</button>

      <div>© {{ currentYear }}</div>

    </div>

  </aside>

  <!-- MAIN -->
  <main class="main">

    <!-- TOPBAR -->
    <header class="topbar">

      <div class="topbar-left">
        <button (click)="toggleSidebar()">☰</button>
        <h1>{{ getCurrentPageTitle() }}</h1>
      </div>

      <div class="topbar-right">

        <button (click)="toggleTheme()">
          {{ darkMode ? '🌙' : '☀️' }}
        </button>

        <div class="user-menu">

          <div class="user-avatar small">
            <img *ngIf="userPhotoUrl"
                 [src]="userPhotoUrl"
                 (error)="userPhotoUrl = null">
            <span *ngIf="!userPhotoUrl">{{ getUserInitials() }}</span>
          </div>

          <span>{{ getUserName() }}</span>

          <button (click)="logout()">🚪</button>

        </div>

      </div>

    </header>

    <!-- CONTENT -->
    <div class="content">
      <router-outlet></router-outlet>
    </div>

  </main>

</div>
