<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar" [class.collapsed]="!isSidebarOpen">
    <div class="sidebar-header">
      <div class="logo">
        <span class="logo-icon">◈</span>
        <span class="logo-text" *ngIf="isSidebarOpen">PeopleOS</span>
      </div>
      <button class="collapse-btn" (click)="toggleSidebar()">
        <span class="collapse-icon">{{ isSidebarOpen ? '◀' : '▶' }}</span>
      </button>
    </div>

    <nav class="sidebar-nav">
      <a *ngFor="let item of menuItems"
         [routerLink]="item.path"
         routerLinkActive="active"
         class="nav-item">
        <span class="nav-icon">{{ item.icon }}</span>
        <span class="nav-label" *ngIf="isSidebarOpen">{{ item.label }}</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-info" *ngIf="isSidebarOpen">
        <div class="user-avatar">{{ getUserInitials() }}</div>
        <div class="user-details">
          <span class="user-name">{{ getUserName() }}</span>
          <span class="user-role">{{ userRole }}</span>
        </div>
      </div>
      <button class="logout-btn" (click)="logout()">
        <span class="logout-icon">🚪</span>
        <span *ngIf="isSidebarOpen">Déconnexion</span>
      </button>
      <div class="version" *ngIf="isSidebarOpen">
        © {{ currentYear }} PeopleOS v1.0
      </div>
    </div>
  </aside>

  <!-- Main content -->
  <main class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="menu-toggle" (click)="toggleSidebar()">
          <span class="menu-icon">☰</span>
        </button>
        <h1 class="page-title">{{ getCurrentPageTitle() }}</h1>
      </div>
      <div class="topbar-right">
        <div class="user-menu">
          <div class="user-avatar small">{{ getUserInitials() }}</div>
          <span class="user-name">{{ getUserName() }}</span>
          <button class="dropdown-btn" (click)="logout()">🚪</button>
        </div>
      </div>
    </header>

    <div class="content">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
